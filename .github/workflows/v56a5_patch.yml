name: Apply v56a5 reliability fixes

on:
  push:
    paths:
      - '.github/workflows/v56a5_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/v56a5_patch.py
      - name: Validate
        run: |
          grep -q 'v56a5' index.html
          grep -q 'priceFetchStatus' index.html
          grep -q 'fetchJsonDocument' index.html
          grep -q '支沿用舊價' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v56a5_patch.yml .github/v56a5_patch.py
          git add index.html
          git commit -m "v56a5 Improve quote data reliability"
          git push

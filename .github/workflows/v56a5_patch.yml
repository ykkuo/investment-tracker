name: Apply v56a5 reliability fixes

on:
  push:
    paths:
      - '.github/workflows/v56a5_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Version
          if 'v56a4' not in s:
              raise SystemExit('v56a4 marker not found')
          s = s.replace('v56a4', 'v56a5', 1)

          # Add per-stock refresh status state once.
          marker = "var priceCache = {};  // {stockId: {price, at}}"
          if marker in s and 'var priceFetchStatus = {};' not in s:
              s = s.replace(marker, marker + "\nvar priceFetchStatus = {}; // {stockId: true=本次抓到新報價, false=沿用舊價}", 1)

          # Replace Yahoo helper with generic fallback helpers + Yahoo parser.
          start = s.index('async function fetchYahooJson(targetUrl) {')
          end = s.index('\nasync function fetchPrice(', start)
          helper = r'''async function fetchTextWithFallback(targetUrl) {
  const sources = [
    'https://r.jina.ai/http://' + targetUrl.replace(/^https?:\/\//, ''),
    PROXY + encodeURIComponent(targetUrl)
  ];
  for (const url of sources) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) continue;
      const text = await res.text();
      if (text && text.trim()) return text;
    } catch(e) {
      // Try the next source.
    } finally {
      clearTimeout(timer);
    }
  }
  return null;
}

async function fetchJsonDocument(targetUrl) {
  const text = await fetchTextWithFallback(targetUrl);
  if (!text) return null;
  const trimmed = text.trim();
  try { return JSON.parse(trimmed); } catch(e) {}
  // Jina may prepend a short text header before JSON.
  const starts = [trimmed.indexOf('{'), trimmed.indexOf('[')].filter(i => i >= 0);
  if (!starts.length) return null;
  const start = Math.min(...starts);
  const endObj = trimmed.lastIndexOf('}');
  const endArr = trimmed.lastIndexOf(']');
  const end = Math.max(endObj, endArr);
  if (end < start) return null;
  try { return JSON.parse(trimmed.slice(start, end + 1)); } catch(e) { return null; }
}

async function fetchYahooJson(targetUrl) {
  const json = await fetchJsonDocument(targetUrl);
  if (json?.chart?.result?.[0]) return json;
  return null;
}
'''
          s = s[:start] + helper + s[end:]

          # Mark real quote refresh success/failure without changing fetchPrice return type.
          fp_start = s.index('async function fetchPrice(sid, code, market) {')
          fp_end = s.index('\nasync function fetchUsdRate()', fp_start)
          fp = s[fp_start:fp_end]
          fp = fp.replace("async function fetchPrice(sid, code, market) {\n", "async function fetchPrice(sid, code, market) {\n  priceFetchStatus[sid] = false;\n", 1)
          fp = fp.replace("        await savePriceDb(sid, price, prevClose);\n        return price;", "        await savePriceDb(sid, price, prevClose);\n        priceFetchStatus[sid] = true;\n        return price;", 1)
          s = s[:fp_start] + fp + s[fp_end:]

          # Make dividend calendar use the same fallback mechanism.
          div_start = s.index('async function fetchDividendCalendar() {')
          div_end = s.index('\nfunction nextDividendFor(', div_start)
          div_block = s[div_start:div_end]
          old_fetch = """    const url = PROXY + encodeURIComponent('https://openapi.twse.com.tw/v1/exchangeReport/TWT48U_ALL');\n    const ctrl = new AbortController();\n    const timer = setTimeout(function(){ctrl.abort();}, 15000);\n    const res = await fetch(url, { signal: ctrl.signal });\n    clearTimeout(timer);\n    if (res.ok) {\n      const json = await res.json();\n      (json||[]).forEach(function(row){"""
          new_fetch = """    const json = await fetchJsonDocument('https://openapi.twse.com.tw/v1/exchangeReport/TWT48U_ALL');\n    if (Array.isArray(json)) {\n      (json||[]).forEach(function(row){"""
          if old_fetch not in div_block:
              raise SystemExit('Dividend fetch block not found')
          div_block = div_block.replace(old_fetch, new_fetch, 1)
          s = s[:div_start] + div_block + s[div_end:]

          # Improve refresh status message and list stale symbols.
          fa_start = s.index('async function fetchAllPrices() {')
          fa_end = s.index('\n// ── 歷史淨值', fa_start)
          new_fa = r'''async function fetchAllPrices() {
  document.getElementById('header-sub').textContent = '更新價格中…';
  await fetchUsdRate();
  priceFetchStatus = {};
  const quoteStocks = stocks.filter(st => st.market!=='基金');
  const promises = quoteStocks.map(st => fetchPrice(st.id, st.code, st.market));
  await Promise.all(promises);
  saveLocalCache();
  const updated = quoteStocks.filter(st => priceFetchStatus[st.id]).length;
  const failed = quoteStocks.filter(st => !priceFetchStatus[st.id]);
  const now = new Date().toLocaleTimeString('zh-TW');
  if (!quoteStocks.length) {
    document.getElementById('header-sub').textContent = '沒有需要自動更新的股票';
  } else if (!failed.length) {
    document.getElementById('header-sub').textContent = '價格已更新 ' + updated + '/' + quoteStocks.length + ' ・ ' + now + ' (報價可能延遲)';
  } else {
    const failedCodes = failed.slice(0,4).map(st => st.code).join('、') + (failed.length>4?'…':'');
    document.getElementById('header-sub').textContent = '更新 ' + updated + '/' + quoteStocks.length + '；' + failed.length + ' 支沿用舊價：' + failedCodes;
  }
  renderPortfolio();
}
'''
          s = s[:fa_start] + new_fa + s[fa_end:]

          # Historical stock prices: reuse Yahoo fallback.
          hp_start = s.index('async function fetchHistPrices(')
          hp_end = s.index('\nasync function fetchHistFx(', hp_start)
          hp = s[hp_start:hp_end]
          hp = re.sub(
              r"\s*const url = PROXY \+ encodeURIComponent\(YF \+ ticker \+ '\?interval=1d&period1='\+period1\+'\\&period2='\+period2\);\n\s*const ctrl = new AbortController\(\);\n\s*const timer = setTimeout\(function\(\)\{ctrl\.abort\(\);\}, 15000\);\n\s*const res = await fetch\(url, \{ signal: ctrl\.signal \}\);\n\s*clearTimeout\(timer\);\n\s*if \(!res\.ok\) continue;\n\s*const json = await res\.json\(\);",
              "\n      const json = await fetchYahooJson(YF + ticker + '?interval=1d&period1='+period1+'&period2='+period2);\n      if (!json) continue;",
              hp,
              count=1
          )
          if 'const url = PROXY + encodeURIComponent(YF + ticker' in hp:
              raise SystemExit('Historical price proxy replacement failed')
          s = s[:hp_start] + hp + s[hp_end:]

          # Historical FX: reuse Yahoo fallback.
          fx_start = s.index('async function fetchHistFx(')
          fx_end = s.index('\n// 在已排序', fx_start)
          fx = s[fx_start:fx_end]
          old_fx = """    const url = PROXY + encodeURIComponent(YF + 'USDTWD=X?interval=1d&period1='+period1+'&period2='+period2);\n    const ctrl = new AbortController();\n    const timer = setTimeout(function(){ctrl.abort();}, 15000);\n    const res = await fetch(url, { signal: ctrl.signal });\n    clearTimeout(timer);\n    if (res.ok) {\n      const json = await res.json();"""
          new_fx = """    const json = await fetchYahooJson(YF + 'USDTWD=X?interval=1d&period1='+period1+'&period2='+period2);\n    if (json) {"""
          if old_fx not in fx:
              raise SystemExit('Historical FX block not found')
          fx = fx.replace(old_fx, new_fx, 1)
          s = s[:fx_start] + fx + s[fx_end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate key changes
        run: |
          grep -q 'v56a5' index.html
          grep -q 'priceFetchStatus' index.html
          grep -q 'fetchJsonDocument' index.html
          grep -q '支沿用舊價' index.html
          ! grep -q "const url = PROXY + encodeURIComponent(YF + ticker + '?interval=1d&period1='" index.html

      - name: Commit v56a5 and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v56a5_patch.yml
          git add index.html
          git commit -m "v56a5 Improve quote data reliability"
          git push

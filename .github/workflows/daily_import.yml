name: 新光證券每日自動匯入

on:
  schedule:
    - cron: '30 8 * * 1-5'   # 台灣時間 16:30，週一到週五
  workflow_dispatch:           # 允許手動觸發（測試用）

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-import   # ← 所有步驟都在這個子資料夾執行

    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 還原機密檔案
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          printf '%s' "$GMAIL_TOKEN"       | base64 -d > token.json
          printf '%s' "$GMAIL_CREDENTIALS" | base64 -d > credentials.json
          printf '%s' "$FIREBASE_SA"       | base64 -d > firebase_service_account.json

      - name: 執行匯入
        env:
          # 腳本用 os.environ 讀取，不再用 regex 改寫原始碼
          PDF_PASSWORD: ${{ secrets.PDF_PASSWORD }}
          FIREBASE_UID: ${{ secrets.FIREBASE_UID }}
        run: |
          set -o pipefail   # 讓 Python 失敗時整個步驟也失敗（否則 tee 會吃掉錯誤碼）
          python skis_auto_import.py --auto 2>&1 | tee import_output.txt

      # 隱私：repo 是公開的，不再上傳 CSV / log artifact（公開 repo 的 artifact 任何登入者都能下載）

      - name: 通知成功
        if: success()
        run: |
          # 統計、警告（⚠️）、無通知信（📭）都帶進 Telegram；多行以 %0A 換行
          RESULT=$(grep -E "完成！|⚠️|📭" import_output.txt | sed ':a;N;$!ba;s/\n/%0A/g' || true)
          RESULT=${RESULT:-執行完成}
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ 新光證券自動匯入 $(date '+%Y-%m-%d')%0A${RESULT}"

      - name: 通知失敗
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ 新光證券自動匯入失敗 $(date '+%Y-%m-%d')%0A請至 GitHub Actions 查看 log：https://github.com/${{ github.repository }}/actions"

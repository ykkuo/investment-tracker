name: Fix price proxy once

on:
  push:
    paths:
      - '.github/workflows/fix_price_proxy_once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace obsolete CORS proxy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const PROXY = 'https://corsproxy.io/?url=';"
          new = "const PROXY = 'https://api.allorigins.win/raw?url=';"
          if old not in s:
              raise SystemExit('Expected proxy line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Taiwan stock price updates" || exit 0
          git push
